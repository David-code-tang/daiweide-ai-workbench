<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戴卫得 X 创作助手</title>
<style>
:root{--bg:#eef2ef;--card:#fff;--fg:#14211b;--mut:#7d8a84;--line:#e7ece9;--soft:#f4f7f5;--ac:#1f6f4a;--mint:#d7f3e3;--mint2:#c3ecd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
main{max-width:1080px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr;padding:32px 16px;gap:32px}}
.brand{color:var(--ac);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}.brand img{width:26px;height:26px;border-radius:50%}
.eyebrow{margin-top:64px;font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
h1{font-size:40px;line-height:1.35;margin:14px 0 18px;letter-spacing:.5px}
.lead{color:var(--mut);margin:0 0 36px}
ol{list-style:none;padding:0;margin:0 0 40px}li{display:flex;gap:18px;padding:6px 0}li span{color:var(--mut);font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border-radius:22px;box-shadow:0 18px 50px rgba(20,33,27,.10),0 0 0 1px rgba(20,33,27,.05);overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:18px 20px 8px}.ch img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.ch b{display:block;font-size:16px}.ch small{display:block;font-size:10.5px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.cb{padding:12px 20px 20px}
.ey{font-size:10.5px;letter-spacing:1.6px;color:var(--ac);font-weight:700;text-transform:uppercase}
.h{font-size:17px;font-weight:700;margin:4px 0 12px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);resize:vertical;outline:none}
textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,111,74,.12)}
button{all:unset;cursor:pointer;display:block;width:100%;text-align:center;background:var(--mint);font-weight:700;border-radius:14px;padding:14px 0;margin-top:16px}button:hover{background:var(--mint2)}
.msg{font-size:12.5px;color:var(--mut);margin-top:10px;min-height:18px}.err{color:#d9534f}.ok{color:var(--ac)}
footer{display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
footer span:first-child{color:var(--ac);font-weight:600}
</style></head><body><main>
<section>
  <div class="brand"><img src="avatar.png" alt="">✦ 戴卫得 X 创作助手</div>
  <div class="eyebrow">Your personal creative space</div>
  <h1>看到好内容，<br>再向前想一步。</h1>
  <p class="lead">把热点与随手收藏的素材放在一起，<br>用你自己的判断，开启下一次表达。</p>
  <ol><li><span>01</span>发现值得说的事</li><li><span>02</span>加入自己的视角</li><li><span>03</span>在 X 内亲自发布</li></ol>
  <p class="note">评论和引用：打开 X，在帖子下点「评论灵感」「引用观点」。<br>原创：点 X 页面右下角的头像按钮，随时整理素材写原创。</p>
</section>
<section class="card">
  <div class="ch"><img src="avatar.png" alt=""><div><b>人设</b><small>Create with your own voice</small></div></div>
  <div class="cb">
    <div class="ey">Your voice</div><div class="h">让生成的内容更像你</div>
    <label>账号定位</label><textarea id="position" rows="3"></textarea>
    <label>表达习惯</label><textarea id="voice" rows="5"></textarea>
    <label>写过的内容</label><textarea id="samples" rows="6" placeholder="贴几条你自己写过、满意的帖子"></textarea>
    <button id="save">保存人设</button><div class="msg" id="msg">正在从工作台读取…</div>
  </div>
  <footer><span id="model">● 连接工作台…</span><span>草稿由你确认 · 在 X 内发布</span></footer>
</section>
</main><script src="options.js"></script></body></html>
